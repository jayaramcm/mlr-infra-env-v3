<svg width="220" height="520" viewBox="0 0 220 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="520" fill="#FAFCFD"/>
  <!-- 1. Brand Blue -->
  <rect x="20" y="20" width="80" height="80" rx="10" fill="#0056A7"/>
  <text x="112" y="68" font-family="'Barlow', sans-serif" font-weight="700" font-size="18" fill="#282828">#0056A7</text>
  <!-- 2. Soft Blue Tint -->
  <rect x="20" y="120" width="80" height="80" rx="10" fill="#E5EEF6" stroke="#0056A7" stroke-opacity="0.1"/>
  <text x="112" y="168" font-family="'Barlow', sans-serif" font-weight="700" font-size="18" fill="#282828">#E5EEF6</text>
  <!-- 3. Lime Accent -->
  <rect x="20" y="220" width="80" height="80" rx="10" fill="#8DC63F"/>
  <text x="112" y="268" font-family="'Barlow', sans-serif" font-weight="700" font-size="18" fill="#282828">#8DC63F</text>
  <!-- 4. Dark Charcoal -->
  <rect x="20" y="320" width="80" height="80" rx="10" fill="#282828"/>
  <text x="112" y="368" font-family="'Barlow', sans-serif" font-weight="700" font-size="18" fill="#282828">#282828</text>
  <!-- 5. Off-White Canvas -->
  <rect x="20" y="420" width="80" height="80" rx="10" fill="#FAFCFD" stroke="#282828" stroke-opacity="0.15"/>
  <text x="112" y="468" font-family="'Barlow', sans-serif" font-weight="700" font-size="18" fill="#282828">#FAFCFD</text>
</svg>
