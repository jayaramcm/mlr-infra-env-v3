<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" fill="none" width="100%" height="100%">
  <!-- Blueprint Background Rect -->
  <rect width="360" height="420" rx="20" fill="#00488C"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 40 0 V 420 M 80 0 V 420 M 120 0 V 420 M 160 0 V 420 M 200 0 V 420 M 240 0 V 420 M 280 0 V 420 M 320 0 V 420" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <path d="M 0 40 H 360 M 0 80 H 360 M 0 120 H 360 M 0 160 H 360 M 0 200 H 360 M 0 240 H 360 M 0 280 H 360 M 0 320 H 360 M 0 360 H 360" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- India / South India Geographic Outline -->
  <!-- Maharashtra -->
  <path d="M 90 70 L 150 50 L 230 75 L 210 125 L 130 140 L 90 120 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="140" y="95" fill="rgba(255, 255, 255, 0.6)" font-family="Montserrat, sans-serif" font-size="11" font-weight="600">MH</text>

  <!-- Telangana -->
  <path d="M 170 120 L 230 110 L 260 160 L 210 195 L 165 160 Z" fill="rgba(141, 198, 63, 0.2)" stroke="#8DC63F" stroke-width="2.2"/>
  <text x="195" y="155" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="12" font-weight="700">Telangana</text>

  <!-- Andhra Pradesh -->
  <path d="M 230 110 L 290 90 L 305 180 L 260 260 L 220 260 L 220 210 L 260 160 Z" fill="rgba(141, 198, 63, 0.15)" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="248" y="210" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="12" font-weight="700">AP</text>

  <!-- Karnataka -->
  <path d="M 120 140 L 175 140 L 210 200 L 180 290 L 130 250 L 115 170 Z" fill="rgba(141, 198, 63, 0.15)" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="135" y="215" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="12" font-weight="700">KA</text>

  <!-- Tamil Nadu -->
  <path d="M 180 290 L 235 270 L 250 350 L 190 380 L 170 330 Z" fill="rgba(141, 198, 63, 0.15)" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="195" y="335" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="12" font-weight="700">TN</text>

  <!-- Glowing Location Pins -->
  <!-- Hyderabad (Central Hub) -->
  <g transform="translate(205, 145)">
    <circle r="9" fill="rgba(141, 198, 63, 0.35)"/>
    <circle r="4.5" fill="#8DC63F"/>
    <circle r="2" fill="#FFFFFF"/>
  </g>
  <!-- Bhadrachalam / Warangal -->
  <g transform="translate(235, 135)">
    <circle r="6" fill="rgba(141, 198, 63, 0.3)"/>
    <circle r="3.5" fill="#8DC63F"/>
  </g>
  <!-- Kamareddy -->
  <g transform="translate(195, 130)">
    <circle r="5" fill="rgba(141, 198, 63, 0.3)"/>
    <circle r="3" fill="#8DC63F"/>
  </g>
  <!-- Chittoor / Tirupati -->
  <g transform="translate(240, 255)">
    <circle r="6" fill="rgba(141, 198, 63, 0.3)"/>
    <circle r="3.5" fill="#8DC63F"/>
  </g>
  <!-- Amaraja Karakambadi -->
  <g transform="translate(255, 245)">
    <circle r="6" fill="rgba(141, 198, 63, 0.3)"/>
    <circle r="3.5" fill="#8DC63F"/>
  </g>
  <!-- Bengaluru -->
  <g transform="translate(175, 265)">
    <circle r="6" fill="rgba(141, 198, 63, 0.3)"/>
    <circle r="3.5" fill="#8DC63F"/>
  </g>
  <!-- Vellore / Chennai -->
  <g transform="translate(235, 290)">
    <circle r="6" fill="rgba(141, 198, 63, 0.3)"/>
    <circle r="3.5" fill="#8DC63F"/>
  </g>
  <!-- Hubli -->
  <g transform="translate(140, 205)">
    <circle r="5" fill="rgba(141, 198, 63, 0.3)"/>
    <circle r="3" fill="#8DC63F"/>
  </g>
  <!-- Nagpur / Pune -->
  <g transform="translate(145, 85)">
    <circle r="5" fill="rgba(141, 198, 63, 0.3)"/>
    <circle r="3" fill="#8DC63F"/>
  </g>
  <g transform="translate(210, 75)">
    <circle r="5" fill="rgba(141, 198, 63, 0.3)"/>
    <circle r="3" fill="#8DC63F"/>
  </g>

  <!-- Legend Bottom Badge -->
  <rect x="20" y="380" width="170" height="26" rx="13" fill="rgba(0, 0, 0, 0.4)"/>
  <circle cx="34" cy="393" r="4" fill="#8DC63F"/>
  <text x="46" y="397" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="10.5" font-weight="600">29 Operational Yards</text>
</svg>
